# Ninjas OS image metadata. Sourced by scripts/lib/common.sh.
# Keep this file to simple KEY="value" assignments (no command substitution).

NINJAS_OS_NAME="Ninjas OS"
NINJAS_OS_ID="ninjas"
NINJAS_OS_VERSION="0.1.0-alpha"
NINJAS_OS_CODENAME="Shuriken"
NINJAS_OS_HOME_URL="https://github.com/thakuramit5464/ninjas-os-starter"

# Values written into the copied Archiso profiledef.sh.
# iso_label must stay short (ISO 9660 volume id, 32 chars max). A YYYYMM
# suffix derived from SOURCE_DATE_EPOCH is appended by prepare-profile.sh,
# mirroring the upstream releng convention.
NINJAS_ISO_NAME="ninjas-os"
NINJAS_ISO_LABEL_PREFIX="NINJAS_OS"
NINJAS_ISO_PUBLISHER="Ninjas OS Project"
NINJAS_ISO_APPLICATION="Ninjas OS Live ISO"

# Live-session convenience account created at boot by ninjas-live-setup.
# See docs/upstream-deviations.md for the security implications.
NINJAS_LIVE_USER="ninja"
