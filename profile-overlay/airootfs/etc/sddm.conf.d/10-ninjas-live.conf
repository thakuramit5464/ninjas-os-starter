# Ninjas OS live image: log the live user straight into the Plasma (Wayland)
# session. Plasma 6.8 ships no X11 session; "plasma" is the wayland-sessions
# entry. Relogin=false so a logout lands on the SDDM greeter instead of
# looping back into autologin.
[Autologin]
User=ninja
Session=plasma
Relogin=false
